# ---------------------------------------------------------------------------
# 出厂模板（只读资源，随发布包分发）。
# 用户配置在可写数据目录：dev = 仓库根 config.ini；打包 = exe 同目录 config.ini。
# 首次运行会**复制**本文件到那里，此后所有改动只写那一份 —— 请勿在此手改
# 个人偏好或机器相关项（如 cuda_probe / ocr_device=cuda），否则会被打进发布包。
# 本文件的值应与 core_engine/config.py::_DEFAULTS 保持一致（缺键兜底以它为准）。
# ---------------------------------------------------------------------------
[software]
history_max_count = 50
screenshots_dir = 
max_shot_windows = 1
max_restore_windows = 3
max_pin_windows = 3
enable_qr = false
selection_mode = auto_commit
save_format = png
save_quality = 90
name_pattern = {datetime}_{ms}
save_no_op_close = false
ocr_device = cpu
ocr_model = v6-tiny
ocr_keep_alive = true
ocr_auto = true
drop_ocr_auto = true

[ui]
theme = system
history_panel_width = 620
history_panel_height = 0
history_grid_cols = 2
history_visible_cards = 5
start_minimized = true
border_color = 100,190,255
border_width = 2
fill_alpha = 50
mask_alpha = 120
picker_size = 7
picker_zoom = 9
overlay_border_color = 100,190,255
overlay_border_width = 1
image_border_color = 100,190,255
image_border_width = 1
qr_border_color = 156,39,176
qr_border_width = 1
table_border_color = 90,220,120
table_border_width = 1
show_text_boxes = true
anno_toolbar_default = false
toolbar_enabled = true
strip_enabled = true
persist_params = true

[hotkey_global]
screenshot_combo = ctrl+alt+r
fullscreen_combo = off
history = ctrl+`
through = off

[hotkey_select]
full_sel = a
scroll_sel = r
color_pick = c
color_fmt = h

[hotkey_overlay]
reocr = ctrl+r
table_ocr = ctrl+shift+t
toggle_anno = ctrl+shift+d
nav = m
ratio = b
toggle_strip = s
toggle_qr = q
toggle_boxes = w
toggle_table = e
fav = f
toggle_through = alt+f
copy_shortcut = shift+c
select_all = ctrl+a
copy_selected = ctrl+c
copy_image = ctrl+shift+c
copy_raw_image = ctrl+alt+c
zoom_modifier = ctrl
geom_zoom_modifier = shift

[hotkey_anno]
undo = ctrl+z
redo = ctrl+shift+z

[engine]
ocr_engine = rapidocr
use_cls = false
table_model = slanet_plus
preprocess_preset = off
scroll_speed = 2
scroll_max_height = 12000
image_max_disk_mb = 50

[annotation]
mosaic_mode = rect
tool_color = 255,95,95
tool_width = 2
text_size = 18
text_bold = false
text_italic = false
num_size = 18
num_start = 1
num_style = circle
arrow_style = single
pen_style = solid
rect_style = rect
line_style = solid
