[general]
start_minimized = true

[ocr]
engine = rapidocr
model_set = v6-tiny
use_cls = false
device = cuda
table_model = slanet_plus
ocr_keep_alive = true
ocr_auto = true

[hotkey]
combo = ctrl+shift+r

[selection]
border_color = 100,190,255
border_width = 2
fill_alpha = 50
mask_alpha = 120
picker_size = 9
picker_zoom = 9

[result]
overlay_border_color = 100,190,255
overlay_border_width = 2
show_text_boxes = true
anno_toolbar_default = false
toolbar_enabled = true
strip_enabled = true
image_border_color = 100,190,255
image_border_width = 1

[preprocess]
preset = off

[screenshot]
selection_mode = manual_copy
save_format = webp
save_quality = 95
name_pattern = scan_{date}_{seq}
scroll_speed = 2
scroll_max_height = 12000

[db]
screenshot_max_count = 3000
image_max_disk_mb = 50

[hotkey_ext]
copy_shortcut = shift+c
history_hotkey = ctrl+`
color_pick = c
color_fmt = h
select_all = ctrl+a
copy_selected = ctrl+c
full_sel = a
reocr = ctrl+r
table_ocr = ctrl+t
toggle_anno = ctrl+d
undo_anno = ctrl+z
redo_anno = ctrl+shift+z
copy_image = alt+c
copy_raw_image = ctrl+alt+c
through_hotkey = alt+f
scroll_sel = r
zoom_modifier = ctrl
geom_zoom_modifier = shift
nav_hotkey = m
ratio_hotkey = e

[ui]
theme = system
max_history_windows = 5
max_pin_windows = 5
history_panel_width = 600
history_grid_cols = 2
history_visible_cards = 5

[paths]
screenshots_dir = 

[annotation]
mosaic_mode = pen
persist_params = true
tool_color = 255,95,95
num_size = 12
num_start = 0
num_style = circle
arrow_style = single
pen_style = solid
rect_style = round
tool_width = 8
line_style = dot

[hotkey_full]
combo = ctrl+shift+q

