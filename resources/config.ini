[software]
history_max_count = 3000
screenshots_dir = 
max_history_windows = 1
max_hist_windows = 3
max_pin_windows = 5
enable_qr = true
selection_mode = manual_copy
save_format = webp
save_quality = 95
name_pattern = scan_{date}_{seq}
save_no_op_close = false
ocr_device = cuda
ocr_model = v6-medium
ocr_keep_alive = true
ocr_auto = true
cuda_probe = {"time": "2026-09-03 21:04:55", "det": "v6-medium", "devices": [{"id": 0, "ok": true, "cpu_ms": 149.5, "dml_ms": 19.8, "speedup": 7.54}, {"id": 1, "ok": false}, {"id": 2, "ok": false}, {"id": 3, "ok": false}, {"id": 4, "ok": false}, {"id": 5, "ok": false}, {"id": 6, "ok": false}, {"id": 7, "ok": false}]}
drop_ocr_auto = true

[ui]
theme = light
history_panel_width = 610
history_panel_height = 771
history_grid_cols = 2
history_visible_cards = 5
start_minimized = true
border_color = 100,190,255
border_width = 2
fill_alpha = 50
mask_alpha = 120
picker_size = 9
picker_zoom = 9
overlay_border_color = 100,190,255
overlay_border_width = 2
image_border_color = 100,190,255
image_border_width = 1
qr_border_color = 156,39,176
table_border_color = 90,220,120
show_text_boxes = true
anno_toolbar_default = false
toolbar_enabled = true
strip_enabled = true
persist_params = true

[hotkey_global]
screenshot_combo = ctrl+shift+r
fullscreen_combo = ctrl+shift+w
history = ctrl+`
through = alt+f

[hotkey_select]
full_sel = a
scroll_sel = r
color_pick = c
color_fmt = h

[hotkey_overlay]
reocr = ctrl+r
table_ocr = ctrl+t
toggle_anno = ctrl+d
nav = m
ratio = b
toggle_strip = s
toggle_qr = q
toggle_boxes = w
toggle_table = e
fav = f
copy_shortcut = shift+c
select_all = ctrl+a
copy_selected = ctrl+c
copy_image = alt+c
copy_raw_image = ctrl+alt+c
zoom_modifier = ctrl
geom_zoom_modifier = shift

[hotkey_anno]
undo = ctrl+z
redo = ctrl+shift+z

[engine]
ocr_engine = rapidocr
use_cls = false
table_model = slanet_plus
preprocess_preset = off
scroll_speed = 2
scroll_max_height = 12000
image_max_disk_mb = 50

[annotation]
mosaic_mode = pen
tool_color = 255,95,95
tool_width = 10
text_size = 18
text_bold = false
text_italic = false
num_size = 32
num_start = 0
num_style = plain
arrow_style = dot
pen_style = glow
rect_style = dialog
line_style = double

